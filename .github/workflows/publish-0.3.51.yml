name: publish-0.3.51

on:
  push:
    branches:
      - release/0.3.51
    paths:
      - .github/workflows/publish-0.3.51.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select R6 hotfix commit
        shell: pwsh
        run: |
          $releaseCommit = (git rev-parse HEAD^).Trim()
          "RELEASE_COMMIT=$releaseCommit" | Out-File -FilePath $env:GITHUB_ENV -Append
          git checkout $releaseCommit

      - name: Configure x64 Release runtime
        run: cmake -S recomp-runtime -B build/recomp-runtime -A x64

      - name: Build x64 Release runtime and tests
        run: cmake --build build/recomp-runtime --config Release

      - name: Run x64 Release runtime tests
        run: ctest --test-dir build/recomp-runtime -C Release --output-on-failure

      - name: Build R6 hotfix package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceZip = Join-Path $env:RUNNER_TEMP "DOAXBV-0.3.5-Alpha.zip"
          $stage = Join-Path $env:RUNNER_TEMP "doaxbv-0351-stage"
          $output = Join-Path $env:GITHUB_WORKSPACE "DOAXBV-0.3.51-Alpha.zip"
          $uri = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v0.35/DOAXBV-0.3.5-Alpha.zip"

          Invoke-WebRequest -Uri $uri -OutFile $sourceZip
          Expand-Archive -Path $sourceZip -DestinationPath $stage

          $runtime = @(Get-ChildItem -Path $stage -Recurse -File -Filter runtime.c |
            Where-Object { $_.FullName -match '[\\/]recomp-runtime[\\/]runtime\.c$' })
          if ($runtime.Count -ne 1) {
            throw "Expected exactly one packaged recomp-runtime/runtime.c, found $($runtime.Count)"
          }

          $changelog = @(Get-ChildItem -Path $stage -Recurse -File -Filter CHANGELOG.md)
          if ($changelog.Count -ne 1) {
            throw "Expected exactly one packaged CHANGELOG.md, found $($changelog.Count)"
          }

          Copy-Item -Path "recomp-runtime/runtime.c" -Destination $runtime[0].FullName -Force
          Copy-Item -Path "CHANGELOG.md" -Destination $changelog[0].FullName -Force

          $patched = Get-Content -Path $runtime[0].FullName -Raw
          if ($patched -match '(?s)#if defined\(_MSC_VER\)\s*__forceinline\s*#endif\s*uint8_t \*recomp_memory') {
            throw "Packaged runtime still force-inlines recomp_memory"
          }
          if ($patched -notmatch 'uint8_t \*recomp_memory\(uint32_t guest_address, size_t width\)') {
            throw "Packaged runtime is missing recomp_memory"
          }

          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $output
          $hash = (Get-FileHash -Algorithm SHA256 $output).Hash.ToLowerInvariant()
          "PACKAGE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "DOAXBV-0.3.51-Alpha.zip SHA-256: $hash"

      - name: Publish 0.3.51 Alpha
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v0.3.51 --repo "$env:GITHUB_REPOSITORY" *> $null) {
            throw "Release v0.3.51 already exists"
          }

          @'
          ## 0.3.51 Alpha

          This is a narrowly scoped hotfix based directly on the published R6 / 0.35 release.

          ### Fixed

          - Fix the final MSVC link failure for the public `recomp_memory` runtime entry point by removing `__forceinline` from its externally visible definition.
          - This addresses issue #36 on Visual Studio 2022 x64 and the same underlying linker failure previously reported in #34 on Visual Studio 2019 Win32.

          ### Validation

          - The release commit is R6 plus the linker fix and changelog entry only.
          - The public runtime is configured, built, and tested as x64 Release on the Windows GitHub runner before publication.
          - The downloadable package is produced from the published 0.3.5 Alpha ZIP, replacing only the patched runtime source and changelog, so bundled prerequisites and the R6 package contents remain otherwise unchanged.

          ### Setup

          Extract into a new folder, drag the supported USA ISO onto `BuildGame.cmd`, and wait for **Setup complete**. Visual Studio 2022 Build Tools with the C++ desktop workload and a Windows SDK are required.

          This hotfix does not change the known R6 gameplay limitations. Occasional volleyball slowdowns, movie/transition slowdown, audio crackle, and some rendering defects remain under investigation.
          '@ | Set-Content -Path release-notes.md

          gh release create v0.3.51 `
            "DOAXBV-0.3.51-Alpha.zip" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:RELEASE_COMMIT" `
            --title "0.3.51 Alpha (R6 linker hotfix)" `
            --notes-file release-notes.md
